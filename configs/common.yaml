model_id: Qwen/Qwen3-1.7B
supported_model_ids:
  - Qwen/Qwen3-1.7B
  - Qwen/Qwen3-4B
  - Qwen/Qwen3-8B
  - Qwen/Qwen3-14B
dataset_name: openai/gsm8k
dataset_config: main
