    repetition_penalty: 1.0
  official_recommended:
    think:
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      max_thinking_tokens: 512
      max_new_tokens: 1024
      repetition_penalty: 1.0
    no_think:
      do_sample: true
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      max_new_tokens: 1024
      repetition_penalty: 1.0
