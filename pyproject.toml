[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-lid"
version = "0.1.0"
description = "Local Qwen3 activation-space LID experiments for GSM8K and degenerate controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "transformers",
  "datasets",
  "huggingface_hub",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "pyyaml",
  "tqdm",
  "accelerate",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
